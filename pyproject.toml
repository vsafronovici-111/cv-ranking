[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-cv-rank"
version = "0.1.0"
description = "Rank CVs against job requirements using an OpenAI-compatible LLM server (Ollama locally, vLLM in production)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Local User" }]
dependencies = ["openai>=1.30.0", "pydantic-settings>=2.0.0", "psycopg[binary]>=3.1.0", "qdrant-client>=1.10.0", "httpx>=0.27.0", "fastapi>=0.115.0", "uvicorn>=0.30.0", "websockets>=13.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
test = ["testcontainers[postgres]>=4.8.0"]
dev = ["ruff>=0.16.0"]

[project.scripts]
cv-ranker = "cv_ranker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes baseline. I: import sorting. UP: modernize syntax
# for the py310+ floor. B: flake8-bugbear common bug patterns. BLE: no bare
# `except Exception` without a documented reason (use `# noqa: BLE001 - why`).
# SLF: flag reaching into another module's `_private` attributes/methods.
# RUF: Ruff's own extra checks.
select = ["E", "F", "I", "UP", "B", "BLE", "SLF", "RUF"]

# FastAPI's `Depends(...)`/`Query(...)`/etc. default-argument idiom is the
# framework's intended pattern (docs use it directly), not the mutable-
# default-argument bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
docstring-code-format = true

