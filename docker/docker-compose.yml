services:
  postgres:
    image: postgres:16-alpine
    container_name: cvranker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvranker
      # Use a subdirectory of the mount point: Postgres refuses to initialize
      # directly on top of a bind-mounted directory (it sees the mount's
      # dot-prefixed metadata and thinks the directory is "not empty").
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persist data on the host so it survives container recreation.
      - ./volume/postgres:/var/lib/postgresql/data
      # Migrations are applied automatically by CVStore.init_schema() on CLI
      # startup, not by Postgres' own docker-entrypoint-initdb.d mechanism,
      # so the same *.sql files work identically for local Postgres, Docker,
      # and CI.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvranker"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cvranker-qdrant
    restart: unless-stopped
    environment:
      # Applies to BOTH the REST/HTTP (6333) and gRPC (6334) interfaces —
      # it's a single service-level secret, not per-protocol. Any client
      # (REST header `api-key: ...` or gRPC metadata `api-key`) must send
      # this exact value. Generate your own with: openssl rand -hex 32
      QDRANT__SERVICE__API_KEY: 9a5e52a320a6b45747bb8eb5a4297c9d25cb054200cda5090da8297f45d825f5
    ports:
      - "6333:6333" # HTTP/REST API
      - "6334:6334" # gRPC API
    volumes:
      # Persist vector data/collections on the host so it survives container recreation.
      - ./volume/qdrant/qdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10


