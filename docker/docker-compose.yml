services:
  postgres:
    image: postgres:16-alpine
    container_name: cvranker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvranker
      # Use a subdirectory of the mount point: Postgres refuses to initialize
      # directly on top of a bind-mounted directory (it sees the mount's
      # dot-prefixed metadata and thinks the directory is "not empty").
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persist data on the host so it survives container recreation.
      - ./volume/postgres:/var/lib/postgresql/data
      # Migrations are applied automatically by CVStore.init_schema() on CLI
      # startup, not by Postgres' own docker-entrypoint-initdb.d mechanism,
      # so the same *.sql files work identically for local Postgres, Docker,
      # and CI.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvranker"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cvranker-qdrant
    restart: unless-stopped
    environment:
      # Applies to BOTH the REST/HTTP (6333) and gRPC (6334) interfaces —
      # it's a single service-level secret, not per-protocol. Any client
      # (REST header `api-key: ...` or gRPC metadata `api-key`) must send
      # this exact value. Generate your own with: openssl rand -hex 32
      QDRANT__SERVICE__API_KEY: 9a5e52a320a6b45747bb8eb5a4297c9d25cb054200cda5090da8297f45d825f5
    ports:
      - "6333:6333" # HTTP/REST API
      - "6334:6334" # gRPC API
    volumes:
      # Persist vector data/collections on the host so it survives container recreation.
      - ./volume/qdrant/qdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    container_name: cvranker-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode (no ZooKeeper)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Two listeners: external (host app) + internal (docker services like kafka-ui)
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - ./volume/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cvranker-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      # Uses the internal listener — kafka-ui runs inside Docker network
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  redis:
    image: redis:7-alpine
    container_name: cvranker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volume/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: cvranker-redis-ui
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      # Uses the internal Docker network hostname — redis-commander runs
      # inside the same network as the `redis` service.
      REDIS_HOSTS: local:redis:6379

